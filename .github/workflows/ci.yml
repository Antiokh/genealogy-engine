name: Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --progress=false
      - run: node --check scripts/sync-engine-to-content.mjs
      - run: npm run check
      - run: npm run build
      - name: Keep generated content badges for README
        uses: actions/upload-artifact@v4
        with:
          name: genealogy-content-badges
          path: dist/badges/*.svg
          if-no-files-found: error
          retention-days: 1

  refresh-readme-badges:
    name: Update fork-local README badges
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: genealogy-content-badges
          path: badges
      - name: Commit updated README badges
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer main push will update the badges."
            exit 0
          fi
          git add -- badges/people.svg badges/events.svg badges/places.svg badges/photos.svg
          if git diff --cached --quiet; then
            echo "README badge counts are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh fork-local genealogy counts [skip ci]"
          git push origin HEAD:main

  sync-content:
    name: Sync verified engine to family site
    needs: verify
    if: github.repository == 'Antiokh/genealogy-engine' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SYNC_TOKEN: ${{ secrets.GENEALOGY_CONTENT_PUSH_TOKEN }}
    steps:
      - name: Require a scoped write token
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Configure GENEALOGY_CONTENT_PUSH_TOKEN with Contents read/write for Antiokh/genealogy-antiokh."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: genealogy-engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Antiokh/genealogy-antiokh
          ref: main
          path: genealogy-content
          token: ${{ secrets.GENEALOGY_CONTENT_PUSH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: genealogy-engine/.nvmrc
      - name: Update only engine-owned paths
        run: node genealogy-engine/scripts/sync-engine-to-content.mjs genealogy-content
      - name: Commit and push engine files
        working-directory: genealogy-content
        run: |
          git config user.name "genealogy-engine[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- .genealogy-engine-managed.json src/components src/styles src/scripts src/pages src/content.config.ts src/routeData.ts public/tree scripts
          if git diff --cached --quiet; then
            echo "Engine content already up to date."
            exit 0
          fi
          git commit -m "chore(engine): sync verified ${GITHUB_SHA}"
          git push origin HEAD:main
