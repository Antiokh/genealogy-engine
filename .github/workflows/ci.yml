name: Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --progress=false
      - run: npm run check
      - run: npm run build

  sync-content:
    name: Sync verified engine to private content
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SYNC_TOKEN: ${{ secrets.GENEALOGY_CONTENT_PUSH_TOKEN }}
    steps:
      - name: Require a private target and scoped write token
        env:
          GH_TOKEN: ${{ secrets.GENEALOGY_CONTENT_PUSH_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Configure GENEALOGY_CONTENT_PUSH_TOKEN with Contents read/write for Antiokh/genealogy-antiokh."
            exit 1
          fi
          IS_PRIVATE=$(gh api repos/Antiokh/genealogy-antiokh --jq '.private')
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "::error::Refusing to sync: Antiokh/genealogy-antiokh is PUBLIC. Make the content repository private first."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: genealogy-engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Antiokh/genealogy-antiokh
          ref: main
          path: genealogy-content
          token: ${{ secrets.GENEALOGY_CONTENT_PUSH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: genealogy-engine/.nvmrc
      - name: Update only engine-owned paths
        run: node genealogy-engine/scripts/sync-engine-to-content.mjs genealogy-content
      - name: Commit and push engine files
        working-directory: genealogy-content
        run: |
          git config user.name "genealogy-engine[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- .genealogy-engine-managed.json src/components src/styles src/scripts src/pages src/content.config.ts src/routeData.ts public/tree scripts
          if git diff --cached --quiet; then
            echo "Engine content already up to date."
            exit 0
          fi
          git commit -m "chore(engine): sync verified ${GITHUB_SHA}"
          git push origin HEAD:main
